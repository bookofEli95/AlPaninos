<html>
  <body style="font-family: sans-serif; background-color: #FAF6F0; padding: 32px;">
    <div style="max-width: 420px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 32px; text-align: center;">
      <h2 style="color: #1C1917; margin-bottom: 8px;">AlPaninos</h2>
      <p style="color: #78716C; margin-top: 0;">Enter this code in the app to verify your email and place your order:</p>
      <div style="font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #A61C14; margin: 24px 0;">
        {{ .Token }}
      </div>
      <p style="color: #A8A29E; font-size: 13px;">This code expires shortly. If you didn't request this, you can ignore this email.</p>
    </div>
  </body>
</html>
